[project]
name = "vera-word-timing"
version = "0.1.0"
description = "Shared VERA word-timing engine: recognizer/aligner ports and #168 contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.25.1",
]

[project.scripts]
vera-word-timing = "vera_word_timing.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_word_timing"]
