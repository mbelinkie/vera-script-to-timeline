[project]
name = "vera-timeline-agent"
version = "0.0.0"
description = "Local-agent package scaffold for VERA Script to Timeline"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.75.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["python/vera_timeline_agent"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
