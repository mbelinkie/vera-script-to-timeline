[project]
name = "vera-timeline-agent"
version = "0.0.0"
description = "Local-agent package scaffold for VERA Script to Timeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.79",
    "jsonschema==4.25.1",
    "opentimelineio==0.18.1",
    "vera-word-timing",
]

[tool.uv.workspace]
members = ["packages/word-timing"]

[tool.uv.sources]
vera-word-timing = { workspace = true }

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.75.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["python/vera_timeline_agent"]

[tool.hatch.build.targets.wheel.force-include]
"python/vera_timeline_agent/assets/text_plus_template.drb" = "vera_timeline_agent/assets/text_plus_template.drb"
"python/vera_timeline_agent/assets/text_plus_template.json" = "vera_timeline_agent/assets/text_plus_template.json"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: real or synthetic media analysis, repeated external-process integration, or tests taking more than about five seconds",
  "fast: cheap unit test retained in the routine gate despite slow module-level integration coverage",
]

[tool.ruff]
target-version = "py312"
# Retained Resolve-console evidence: hashed, exec()-ed with injected globals; keep byte-for-byte.
extend-exclude = ["docs/investigations/issue-149/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Engine scripts vendored from the word-timing v2 study; they run inside their
# own external runtimes (MFA, Parakeet) and keep the study's measured behaviour.
"packages/word-timing/src/vera_word_timing/adapters/engines/**" = [
  "E501", "B905", "RUF046", "SIM115", "RUF001", "RUF005", "RUF007", "E741",
]
