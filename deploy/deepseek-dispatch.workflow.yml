# INSTALL this into .github/workflows/deepseek-dispatch.yml via a reviewed PR.
# Intentionally stored outside .github until authorized GitHub Workflows:write is available.
name: VERA DeepSeek dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

# Do not overlap paid campaigns on the private single host.
concurrency:
  group: vera-deepseek-dispatch
  queue: max
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deepseek dispatch' &&
      vars.VERA_DEEPSEEK_DISPATCH_ENABLED == 'true'
    runs-on: [self-hosted, macOS, vera-deepseek]
    timeout-minutes: 45
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify current issue and invoke existing bounded private controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERA_DEEPSEEK_DISPATCH_ENABLED: ${{ vars.VERA_DEEPSEEK_DISPATCH_ENABLED }}
          VERA_DEEPSEEK_DRY_RUN: ${{ vars.VERA_DEEPSEEK_DRY_RUN }}
          VERA_DEEPSEEK_ALLOWED_ACTORS: ${{ vars.VERA_DEEPSEEK_ALLOWED_ACTORS }}
          VERA_DEEPSEEK_TASK_CAP_USD: ${{ vars.VERA_DEEPSEEK_TASK_CAP_USD }}
        run: node scripts/deepseek-dispatch.mjs
