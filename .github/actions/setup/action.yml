name: Set up VERA
description: Node, npm packages, uv/Python packages and FFmpeg; optionally Chromium for capture tests.
inputs:
  chromium:
    description: Install Playwright's Chromium for the TypeScript capture tests
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.17.0
    - name: Install TypeScript dependencies
      shell: bash
      run: npm ci
    - name: Install Chromium for capture tests
      if: ${{ inputs.chromium == 'true' }}
      shell: bash
      run: |
        npx playwright install --with-deps chromium
        # Ubuntu restricts user namespaces for downloaded Chromium builds. Allow
        # only this runner's browser cache; the capture worker keeps its sandbox.
        printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
          "profile vera-playwright $HOME/.cache/ms-playwright/** flags=(unconfined) {" '  userns,' '}' \
          | sudo tee /etc/apparmor.d/vera-playwright >/dev/null
        sudo apparmor_parser -r /etc/apparmor.d/vera-playwright
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: 0.12.5
        python-version: 3.12.14
        enable-cache: true
    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
    # Media tests need FFmpeg; fail early rather than letting them skip. The
    # downloaded packages are cached because Ubuntu's mirror is sometimes slow.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-cache
        key: apt-ffmpeg-ubuntu-24.04-v1
    - name: Install FFmpeg
      shell: bash
      run: |
        mkdir -p ~/apt-cache/partial
        sudo apt-get update -q -o Acquire::Retries=3
        sudo apt-get install --yes -q --no-install-recommends -o Acquire::Retries=3 \
          -o Dir::Cache::archives="$HOME/apt-cache" ffmpeg
        sudo chown -R "$USER" ~/apt-cache
        ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1
