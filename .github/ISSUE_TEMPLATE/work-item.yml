name: Bounded work item
description: Create implementation, investigation, review, or acceptance work.
title: ""
labels: ["model:terra", "effort:medium", "type:implementation"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: prework
    attributes:
      label: Pre-work questions (keep the heading in your answer)
      description: Answer each in one or two lines. Keep the level-two heading so the Ready check recognizes it.
      value: |
        ## Pre-work check

        1. **Who can do what afterwards?** Name a person and a new ability, not "another issue can proceed":
        2. **Where was it asked for?** Quote Matthew or the product spec, not an agent-written issue:
        3. **What is the simplest version?** Explain any additional scope and its benefit:
        4. **Does it fit in a day?** If not, split it:
        5. **Does it add any checking machinery?** If yes, link the actual failure and Matthew's approval:
        6. **Can Matthew see it finished?** Give an observable result or command and time budget:
        7. **Is the real-Resolve check cheap and repeatable?** Under five minutes, a throwaway project, rerunnable, never one-use (or N/A):
        8. **How deep is the chain?** At most one open blocker, which must also name a new human ability:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Current evidence and context
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failure states
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and producer acceptance
      description: Tests to run and any real-application check. Producer steps only for taste or product judgments; agents decide technical matters (see AGENTS.md).
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Use one `- Blocked by #123` or `- Blocked by owner/repo#123` line per prerequisite, or write `None`. Parent/sub-issue links do not imply ordering.
      value: "None"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Before Ready, leave exactly one `model:*` and one `effort:*` routing label, then use `npm run roadmap -- ready <issue>`. This command verifies acceptance and requires every dependency to be closed and Done."
