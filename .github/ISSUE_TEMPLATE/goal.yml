name: Roadmap goal
description: Create a parent outcome that rolls up bounded sub-issues.
title: "Goal: "
labels: ["model:terra", "effort:medium", "type:goal"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Goal outcome
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Use one `- Blocked by #123` or `- Blocked by owner/repo#123` line per prerequisite, or write `None`.
      value: "None"
    validations:
      required: true
  - type: textarea
    id: child_work
    attributes:
      label: Child work
      description: Link bounded sub-issues. These links roll up scope but do not imply execution order.
    validations:
      required: true
