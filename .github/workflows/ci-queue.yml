name: CI queue

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, closed, converted_to_draft, edited]
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [reconcile, init]
        default: reconcile
      control_issue:
        description: Existing dedicated public queue control issue (init only)
        type: string
        default: ''

# This job executes ONLY default-branch code, never candidate code or artifacts.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

# Queue every controller event so an unfinished validation cannot lose its
# trusted completion handoff.
concurrency:
  group: vera-ci-queue-controller
  queue: max

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.VERA_CI_QUEUE_ENABLED == 'true' &&
       (github.event_name == 'pull_request_target' ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/queue ')) ||
        github.event_name == 'workflow_run'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERA_CI_QUEUE_ENABLED: ${{ vars.VERA_CI_QUEUE_ENABLED }}
          VERA_QUEUE_ACTION: ${{ inputs.action }}
          VERA_QUEUE_ISSUE: ${{ inputs.control_issue }}
        run: node scripts/ci-queue.mjs
