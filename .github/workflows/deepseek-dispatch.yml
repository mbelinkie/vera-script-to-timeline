# Runs on GitHub-hosted infrastructure; it validates public state only.
name: VERA DeepSeek dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

# This workflow validates public issue state only. The Mac-owned receiver polls
# GitHub outbound and independently enforces its private manifest and receipts.
concurrency:
  group: vera-deepseek-dispatch
  queue: max
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deepseek dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate current request; never invoke the Mac adapter here
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERA_DEEPSEEK_DISPATCH_ENABLED: ${{ vars.VERA_DEEPSEEK_DISPATCH_ENABLED }}
          VERA_DEEPSEEK_ALLOWED_ACTORS: ${{ vars.VERA_DEEPSEEK_ALLOWED_ACTORS }}
          VERA_DEEPSEEK_TASK_CAP_USD: ${{ vars.VERA_DEEPSEEK_TASK_CAP_USD }}
        run: node scripts/deepseek-dispatch.mjs
