name: Validate

# Every PR and every push to main runs the full suite, split across parallel
# free runners. Plain-Markdown PRs take the fast "Docs only" route instead.
# Branch protection requires the final "TypeScript and Python" job.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHARDS: 6

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      route: ${{ steps.route.outputs.result }}
    steps:
      # The classifier always comes from the base branch, so a PR cannot
      # change the rule that decides how it is tested.
      - name: Check out base (trusted classifier)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out PR history
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Choose route
        id: route
        env:
          VERA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cd candidate && node ../trusted/scripts/ci-docs-only.mjs
          else
            echo "result=full" >> "$GITHUB_OUTPUT"
          fi

  docs-only:
    name: Docs only
    needs: classify
    if: ${{ needs.classify.outputs.route == 'docs' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed documentation whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  checks:
    name: Lint, types and TypeScript tests
    needs: classify
    if: ${{ needs.classify.outputs.route == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: Contracts, TypeScript lint, types and tests
        run: VITEST_MAX_WORKERS=1 npm run check:contracts-generated && VITEST_MAX_WORKERS=1 npm run check:typescript
      - name: Python lint and types
        run: npm run lint:python && npm run typecheck:python
      - name: Lockfiles unchanged
        run: git diff --exit-code -- package-lock.json uv.lock

  python:
    name: Python tests (${{ matrix.shard }}/6)
    needs: classify
    if: ${{ needs.classify.outputs.route == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run this share of the Python tests
        env:
          VERA_TEST_SHARD: ${{ matrix.shard }}/${{ env.SHARDS }}
          # Two workers leave room for media and CLI subprocesses on 4 cores.
          PYTEST_ADDOPTS: -n 2 --dist load --durations=0 --durations-min=1
        run: uv run --frozen pytest

  result:
    # The required check. Its name must stay "TypeScript and Python".
    name: TypeScript and Python
    needs: [classify, docs-only, checks, python]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: All selected jobs passed
        env:
          ROUTE: ${{ needs.classify.outputs.route }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS: ${{ needs.docs-only.result }}
          CHECKS: ${{ needs.checks.result }}
          PYTHON: ${{ needs.python.result }}
        run: |
          echo "route=$ROUTE classify=$CLASSIFY docs=$DOCS checks=$CHECKS python=$PYTHON"
          [ "$CLASSIFY" = success ] || exit 1
          case "$ROUTE" in
            docs) [ "$DOCS" = success ] ;;
            full) [ "$CHECKS" = success ] && [ "$PYTHON" = success ] ;;
            *) exit 1 ;;
          esac
