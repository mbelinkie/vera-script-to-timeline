name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          python-version: 3.12.14
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      # Slice 1.2 narration normalization already requires the system FFmpeg
      # executable; install it explicitly because ubuntu-24.04 does not include
      # it in PATH on a clean runner.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run repository validation
        run: npm run validate

      - name: Verify lockfiles remain unchanged
        run: git diff --exit-code -- package-lock.json uv.lock
