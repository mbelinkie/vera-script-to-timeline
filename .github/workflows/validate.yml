name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

# A newer push to the same pull request supersedes its older, now-obsolete
# revision. Push runs are keyed by commit so post-merge integration runs are
# never cancelled or replaced. Cancelled runs remain non-passing evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: TypeScript and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install TypeScript dependencies
        run: npm ci

      # Capture tests launch Chromium directly; npm ci installs Playwright but
      # does not provision its browser binary or Linux system dependencies.
      - name: Install Chromium for capture tests
        run: npx playwright install --with-deps chromium

      # Ubuntu restricts user namespaces for downloaded Chromium builds.
      # Allow only this disposable runner's browser cache, not all processes;
      # the capture worker still requires chromiumSandbox: true.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Permit sandbox namespaces for CI Chromium
        run: |
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            "profile vera-playwright $HOME/.cache/ms-playwright/** flags=(unconfined) {" \
            '  userns,' \
            '}' | sudo tee /etc/apparmor.d/vera-playwright >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/vera-playwright

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          python-version: 3.12.14
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      # Slice 1.2 narration normalization already requires the system FFmpeg
      # executable; install it explicitly because ubuntu-24.04 does not include
      # it in PATH on a clean runner.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      # Frozen fixture tests skip when FFprobe is absent; fail before the gate
      # instead of letting a missing tool become a silent skip.
      - name: Preflight required media tools
        id: preflight
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      # JUnit, durations and the teed log are reporting-only; they do not change
      # test selection. pipefail keeps the gate's exit status authoritative.
      - name: Run repository validation
        id: validate
        shell: bash
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/vera-evidence/pytest-junit.xml --durations=25
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/vera-evidence"
          VITEST_MAX_WORKERS=1 npm run validate 2>&1 | tee "$RUNNER_TEMP/vera-evidence/validate.log"

      - name: Verify lockfiles remain unchanged
        id: lockfiles
        run: git diff --exit-code -- package-lock.json uv.lock

      # Runs after failures too, so evidence is retained; a successful
      # collection or upload never changes an earlier failed step's result.
      - name: Collect validation evidence
        if: ${{ !cancelled() }}
        env:
          VERA_OUTCOME_PREFLIGHT: ${{ steps.preflight.outcome }}
          VERA_OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          VERA_OUTCOME_LOCKFILES: ${{ steps.lockfiles.outcome }}
          VERA_RUNNER_LABEL: ubuntu-24.04
        run: node scripts/cloud-evidence-collect.mjs --output "$RUNNER_TEMP/vera-evidence"

      # Only the sanitized manifest is published; raw JUnit, the teed log,
      # worktree contents and caches are not. Treat this artifact as public.
      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vera-validation-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vera-evidence/manifest.json
          if-no-files-found: warn
